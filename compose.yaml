name: gaia-evaluation
x-app: &app
  build: .
  env_file:
    - path: .env
      required: false
  environment: &env
    DATABASE_URL: postgresql+psycopg://gaia:gaia@db/gaia
    DEMO_MODE: ${DEMO_MODE:-true}
    MOCK_AGENT_URL: http://127.0.0.1:8101
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gaia
      POSTGRES_PASSWORD: gaia
      POSTGRES_DB: gaia
    volumes: [gaia-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U gaia"]
      interval: 3s
      timeout: 3s
      retries: 25
  api:
    <<: *app
    init: true
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10
volumes:
  gaia-db:
