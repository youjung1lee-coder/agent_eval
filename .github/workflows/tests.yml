name: Evaluation platform checks
on: [push, pull_request]
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --no-cache-dir -r requirements.txt
      - run: python -m pytest -q -m 'not real_e2e'
      - run: python -m scripts.secret_scan --source
      - run: node --check ui/app.js
  real-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --no-cache-dir -r requirements.txt
          # The upstream 0.3.18 Linux CPU wheel links musl; Ubuntu needs a native build.
          CMAKE_ARGS="-DGGML_NATIVE=OFF" CMAKE_BUILD_PARALLEL_LEVEL=2 python -m pip install --force-reinstall --no-cache-dir --no-deps --no-binary=llama-cpp-python --index-url https://pypi.org/simple llama-cpp-python==0.3.18
          python -c "from llama_cpp import Llama; print('Native judge runtime loaded')"
          python -m venv .phoenix-venv
          .phoenix-venv/bin/python -m pip install --no-cache-dir -r requirements-phoenix.txt
          python -m scripts.download_judge
      - run: |
          .phoenix-venv/bin/python -m scripts.start_phoenix > phoenix.log 2>&1 &
          python -m scripts.wait_phoenix
          EVAL_REAL_E2E=1 python -m pytest -q -m real_e2e
