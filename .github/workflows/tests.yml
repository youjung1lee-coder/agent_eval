name: Evaluation platform checks
on: [push, pull_request]
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --no-cache-dir -r requirements.txt
      - run: python -m pytest -q -m 'not real_e2e'
      - run: python -m scripts.secret_scan --source
      - run: node --check ui/app.js
  real-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --no-cache-dir -r requirements.txt
          python -m venv .phoenix-venv
          .phoenix-venv/bin/python -m pip install --no-cache-dir -r requirements-phoenix.txt
          python -m scripts.download_judge
      - run: |
          .phoenix-venv/bin/python -m scripts.start_phoenix > phoenix.log 2>&1 &
          python -m scripts.wait_phoenix
          EVAL_REAL_E2E=1 python -m pytest -q -m real_e2e
